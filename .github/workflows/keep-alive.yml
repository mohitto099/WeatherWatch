name: Keep Render Awake (9AM-3PM)

on:
  schedule:
    # Runs every 14 minutes, but only during hours 3, 4, 5, 6, 7, 8, and 9 (UTC)
    # This roughly equals 8:30 AM to 3:30 PM IST
    - cron: '*/14 3-9 * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: curl -s https://weather-watch-backend-97ri.onrender.com/
